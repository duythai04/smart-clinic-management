server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: mediclinic-server

  datasource:
    url: jdbc:mysql://127.0.0.1:${DB_PORT:32770}/mediclinic?useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:mediclinic}
    password: ${DB_PASSWORD}

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.mediclinic: DEBUG
