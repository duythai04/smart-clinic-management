services:
  mysql:
    image: mysql:8.4
    container_name: mediclinic-mysql

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: mediclinic
      MYSQL_USER: mediclinic
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "127.0.0.1::3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 --silent
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mediclinic-redis

    restart: unless-stopped

    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
